services:
  frontend:
    build: ./client
    image: todo_frontend:1.0.0
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    depends_on:
      - backend
  backend:
    build: ./server
    image: todo_backend:1.0.0
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dainwi
      POSTGRES_PASSWORD: d123a456
      POSTGRES_DB: todo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: todo_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
